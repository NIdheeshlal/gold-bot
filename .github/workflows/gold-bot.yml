name: Gold MACD bot

on:
  schedule:
    - cron: "1,16,31,46 * * * 0-5"   # every 15 min, ~1 min after each candle closes (UTC), Sun-Fri
  workflow_dispatch:                  # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Send a test message to Telegram"
        type: boolean
        default: true

permissions:
  contents: write                     # needed to save state.json

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check gold and send alerts
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then python gold_bot.py test; fi
          python gold_bot.py
      - name: Save state
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
